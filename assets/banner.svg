<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1829" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes scanline {
      0% { transform: translateX(-600px); }
      100% { transform: translateX(1200px); }
    }
    .pulsing-glow {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .flowing-path {
      stroke-dasharray: 12, 12;
      animation: flowDash 14s linear infinite;
    }
    .pill-float-1 {
      animation: floatPill1 4.5s ease-in-out infinite;
    }
    .pill-float-2 {
      animation: floatPill2 5.5s ease-in-out infinite;
    }
    .scanner {
      animation: scanline 8s linear infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />

  <!-- Subtle Modern Tech Grid -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.22">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glowing Orbs in Background (Dynamic) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="1020" cy="260" r="160" fill="#818cf8" opacity="0.14" filter="url(#glow)" class="pulsing-glow" style="animation-delay: -3s;" />

  <!-- Animated Data Flow Curves in Background -->
  <path d="M -50 280 C 300 240, 450 340, 850 270 C 1050 230, 1150 290, 1250 260" fill="none" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.4" class="flowing-path" />
  <path d="M -50 90 C 350 140, 650 30, 950 110 C 1100 150, 1180 80, 1250 100" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" class="flowing-path" style="animation-direction: reverse; animation-duration: 18s;" />

  <!-- Floating Dynamic Tech Cards (Kept at Sides to Not Obstruct Text) -->
  <!-- Left Side Interactive Pill -->
  <g class="pill-float-1" transform="translate(60, 240)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">DEVTOOLS PROTOCOL</text>
  </g>

  <!-- Left Side Small Tag -->
  <g class="pill-float-2" transform="translate(100, 70)">
    <rect width="135" height="32" rx="16" fill="url(#cardGrad1)" stroke="#6366f1" stroke-width="1" filter="url(#cardShadow)" />
    <text x="20" y="20" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">⚡ FAST CDP / BiDi</text>
  </g>

  <!-- Right Side Interactive Pill -->
  <g class="pill-float-2" transform="translate(940, 65)">
    <rect width="195" height="42" rx="21" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="24" cy="21" r="6" fill="#38bdf8" />
    <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AUTONOMOUS AGENTS</text>
  </g>

  <!-- Right Side Cloud Grid Pill -->
  <g class="pill-float-1" transform="translate(970, 245)">
    <rect width="165" height="38" rx="19" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="1" filter="url(#cardShadow)" />
    <circle cx="22" cy="19" r="5" fill="#ec4899" />
    <text x="36" y="24" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">🌐 CLOUD GRID MATRIX</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Always on top, fully unobstructed) -->
  <!-- Category Badge Pill -->
  <g transform="translate(600, 72)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="0" y="5" fill="#c7d2fe" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
    HEADLESS BROWSERS &amp; AUTOMATION
  </text>

  <!-- Gradient Sub-Heading -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="url(#cyanPurple)" letter-spacing="0.4">
    Next-Gen Web Automation • Cloud Testing Grids • AI Web Agents • Scraping Engines
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Tracking Playwright, Puppeteer, Selenium, AI Browser Agents, and Enterprise Cloud Testing Grids
  </text>

  <!-- Bottom Visual Accent Bar -->
  <rect x="475" y="275" width="250" height="3" rx="1.5" fill="url(#cyanPurple)" />
</svg>
